[package]
name = "comic-source"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
# Default: all sites compiled into one binary (local dev/test).
# Packaging builds each site separately with --no-default-features.
default = ["komikcast", "natsu", "shinigami"]
komikcast = []
natsu = []
shinigami = []

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", features = ["json"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", features = ["test"] }
aidoku-test = { git = "https://github.com/Aidoku/aidoku-rs.git" }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
