name: Build & Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build & assemble packages
        run: |
          mkdir -p site
          for site in natsu komikcast; do
            cargo build --release --no-default-features --features "$site"
            mkdir -p Payload
            cp target/wasm32-unknown-unknown/release/comic_source.wasm Payload/main.wasm
            cp "res/$site.json" Payload/source.json
            zip -r "site/id.$site.aix" Payload
            rm -rf Payload
          done
          cp index.json site/index.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
